# =============================================================================
# release-demo.yml — build and publish the RENDERED DEMO from a released tag.
#
# LAYER 1 — THIS TEMPLATE REPOSITORY ONLY. The demo is what "a module built from
#   this template renders as, out of the box"; a created module has no such
#   thing, and its releases are CalVer via module-release.yml. The first-run
#   bootstrap therefore REMOVES this file (the `REMOVE=` line in
#   scripts/first-run-bootstrap.sh), and a repository guard makes it a no-op
#   even if a copy survives.
#
# Purpose:   render the demo that the Pages landing page advertises as "the
#            current release", FROM THE RELEASED TAG, publish it to
#            gh-pages/demo/<tag>/ and repoint the landing page at it, in one
#            commit. Replaces a manual promotion step.
#
# THE BUG THIS FIXES: the demo used to be copied by hand out of a feature-branch
#            preview built BEFORE Release Please bumped the version, so the path
#            claimed one release and the content another
#            (demo/v0.5.2/en/index.html renders "… Module Template v2026.0.0"),
#            and the QA report inside it was the pre-release one. Two things
#            caused it and both are fixed here: the promotion was manual, and
#            the demo IG's own version was a fixed literal unrelated to any
#            release. Now the tag drives both — see "Demo version" below.
#
# Triggers:  release: published (the normal path — Release Please's release PR
#            is merged by a human, the release is published, this runs), plus
#            workflow_dispatch to re-render a given tag (input `tag`). A
#            PRE-RELEASE is skipped on the release trigger: it is not "the
#            current release" and must not move the landing-page links; dispatch
#            can still render one, and `update_landing_page: false` publishes
#            demo/<tag>/ without repointing the page.
#
# Toggle:    vars.ENABLE_RELEASE_DEMO — ON by default; set the repository
#            variable to 'false' to skip the job (it shows as "skipped", not
#            failed). Same convention as ENABLE_PREVIEW / ENABLE_RELEASE_PLEASE.
#
# Pages two modes (vars.PAGES_ACTIONS_ENABLED): identical to ig-publisher.yml —
#            unset/not 'true' (default) means "Deploy from a branch → gh-pages"
#            and this workflow only git-pushes; 'true' additionally uploads the
#            gh-pages tree as a Pages artifact and runs the deploy job. Set it
#            only after switching Settings → Pages to "GitHub Actions".
#
# Terminology: auto-selected exactly as in ig-publisher.yml — SU-TermServ via a
#            client-certificate nginx proxy when all three SU_TERMSERV_CLIENT_*
#            secrets are present, otherwise the public HL7 fallback with a
#            ::notice. The build never hard-fails for lack of the credential.
#
# Demo version: the demo IG's `version` comes from the {{CALVER_VERSION}}
#            placeholder, substituted by scripts/self-check-substitute.sh. For a
#            branch preview that is a fixed draft value. HERE the script is
#            given SELF_CHECK_RELEASE_TAG, so the value becomes
#            <CALVER_YEAR>.0.0-template.<tag without v> — the MII CalVer shape
#            the scaffold teaches, carrying the template release it was built
#            from. After the build, the generated ImplementationGuide is read
#            back and the job FAILS unless it carries exactly that value, so a
#            published demo can never again claim a version unrelated to its tag.
#
# Human-gated: this workflow publishes nothing a human did not already gate. The
#            gate is upstream and unchanged: Release Please's release PR is
#            merged by a human and the GitHub Release is published by a human.
#            It writes ONLY gh-pages/demo/<tag>/ and gh-pages/index.html. The
#            site ROOT's other content and every version-like path stay
#            reserved for the gated -go-publish output (go-publish.yml), and
#            branches/ stays the preview surface. This is NOT a formal FHIR
#            publication and never dispatches one.
#
# Retention: older demo/<tag>/ directories are KEPT, never pruned — permanent,
#            externally linkable renderings. cleanup-gh-pages.yml cannot sweep
#            them: it only removes directories carrying a .branch-name marker,
#            which this workflow deliberately never writes (a guard fails the
#            job if one appears).
#
# Fixed versions: the IG Publisher jar (+ SHA-256), SUSHI and Jekyll are pinned
#            in the env: block below under the SAME names ig-publisher.yml,
#            go-publish.yml and module-release.yml use;
#            scripts/toolchain-pins.test.mjs fails the build if the blocks drift
#            apart. The JDK, Node and Ruby are pinned by the setup-* actions.
# =============================================================================
name: Release demo

on:
  # NOT `release: types: [published]`. release-please publishes the release with
  # the default GITHUB_TOKEN, and GitHub suppresses workflow triggers from events
  # that token raises (loop prevention) — so a release trigger here never fires and
  # the demo silently keeps serving the previous release. release-please.yml calls
  # this workflow directly instead, inside the run that created the release.
  workflow_call:
    inputs:
      tag:
        description: "Release tag to render, e.g. v0.6.0"
        required: true
        type: string
      update_landing_page:
        description: "Repoint the gh-pages landing page at this tag"
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re-)render, e.g. v0.5.2"
        required: true
        type: string
      update_landing_page:
        description: "Repoint the gh-pages landing page at this tag"
        required: false
        default: true
        type: boolean

permissions:
  contents: write # push the demo + landing page to the gh-pages branch
  pages: write # PAGES_ACTIONS_ENABLED deploy path
  id-token: write # deploy-pages OIDC

concurrency:
  # OWN lane, not the shared gh-pages-writes group. In a shared group GitHub
  # REPLACES a still-queued run whenever a newer one arrives (cancel-in-progress
  # only protects running jobs) — measured three times: the post-release dev
  # push enqueued an IG-preview run into gh-pages-writes and evicted the queued
  # release demo. One demo at a time still holds via this group; write races on
  # the gh-pages BRANCH are handled by the push retry below.
  group: release-demo
  cancel-in-progress: false

env:
  # Pinned toolchain — identical to ig-publisher.yml / go-publish.yml /
  # module-release.yml. A workflow cannot read another workflow's env:, so the
  # blocks are copies; scripts/toolchain-pins.test.mjs fails the build if they
  # stop agreeing.
  PUBLISHER_VERSION: "2.3.2"
  PUBLISHER_SHA256: "07c576024df917cc1f879b6b5a64147cd0222d5b4129688e8f0ad9ccce58b1d5"
  SUSHI_VERSION: "3.20.1"
  JEKYLL_VERSION: "4.4.1"

jobs:
  build:
    # Layer 1: the template repository's own demo. The bootstrap removes this
    # file from a created module; the repository guard makes a surviving copy a
    # no-op rather than a confusing failure.
    if: ${{ vars.ENABLE_RELEASE_DEMO != 'false' && endsWith(github.repository, '/mii-kds-module-template') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      skip: ${{ steps.tag.outputs.skip }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve the release tag
        id: tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_UPDATE_PAGE: ${{ inputs.update_landing_page }}
        run: |
          set -euo pipefail
          if [ "${IS_PRERELEASE:-false}" = "true" ]; then
            echo "::notice::${RELEASE_TAG} is a pre-release — skipping the release demo. The landing page advertises the current stable release; dispatch this workflow manually to render a pre-release under demo/<tag>/."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          tag="${RELEASE_TAG:-${INPUT_TAG:-}}"
          if [ -z "${tag}" ]; then
            echo "::error::No release tag to build — pass the 'tag' input when dispatching manually."
            exit 1
          fi
          # SemVer with the repo's v-prefix: the template repo's OWN releases,
          # cut by Release Please. (A module's CalVer tags belong to
          # module-release.yml, and this file is gone in a module anyway.)
          if ! printf '%s' "${tag}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)*$'; then
            echo "::error::'${tag}' is not a vMAJOR.MINOR.PATCH release tag."
            exit 1
          fi
          update_page="true"
          if [ -z "${RELEASE_TAG:-}" ] && [ "${INPUT_UPDATE_PAGE}" = "false" ]; then
            update_page="false"
          fi
          echo "skip=false" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "update_page=${update_page}" >> "${GITHUB_OUTPUT}"
          echo "Rendering demo for ${tag} (landing page update: ${update_page})."

      # Two checkouts on purpose:
      #   * the workspace root is THIS ref — it supplies the publishing tooling
      #     (scripts/update-demo-links.mjs, scripts/self-check-substitute.sh).
      #     Taking them from the tag instead would make re-rendering an OLD
      #     release impossible, because that tag predates the tooling.
      #   * release-src/ is the TAG — the only thing that gets built.
      - name: Checkout the publishing tooling (this ref)
        if: ${{ steps.tag.outputs.skip != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout the released tag (the only source that is built)
        if: ${{ steps.tag.outputs.skip != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}
          path: release-src
          persist-credentials: false

      - name: Set up Node.js
        if: ${{ steps.tag.outputs.skip != 'true' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Set up Java (for the IG Publisher)
        if: ${{ steps.tag.outputs.skip != 'true' }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Ruby (for Jekyll)
        if: ${{ steps.tag.outputs.skip != 'true' }}
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"

      - name: Install Jekyll (pinned — the IG template renders via Jekyll)
        if: ${{ steps.tag.outputs.skip != 'true' }}
        run: gem install jekyll -v "${JEKYLL_VERSION}"

      - name: Self-check substitution, with the demo version derived from the tag
        id: subst
        if: ${{ steps.tag.outputs.skip != 'true' }}
        shell: bash
        working-directory: release-src
        env:
          # The ONE difference from the preview build: the demo IG's version is
          # derived from the tag instead of the fixed draft literal, so what is
          # rendered names the release it was built from. The script's own guard
          # fails if the substituted sushi-config.yaml does not declare it.
          SELF_CHECK_RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # The script comes from THIS ref (the workspace root), the tree it
          # edits is the TAG — so an old tag can be re-rendered with today's
          # tooling. Nothing is committed: this workflow never pushes source.
          bash ../scripts/self-check-substitute.sh

      - name: Disable the version comparison when toggled off
        # Same treatment as ig-publisher.yml. ENABLE_VERSION_COMPARISON=false is
        # documented as switching the FEATURE off in every build workflow — a
        # workflow that publishes must not quietly bypass a documented toggle,
        # so the release demo honours it too. (The demo REPORT that
        # ig-publisher.yml renders is preview-only and has no counterpart here.)
        if: ${{ steps.tag.outputs.skip != 'true' && vars.ENABLE_VERSION_COMPARISON == 'false' }}
        shell: bash
        working-directory: release-src
        run: |
          set -euo pipefail
          # Comment out any explicit versions, then set the publisher's NATIVE
          # off-value: the ig-parameters registry documents that an ABSENT
          # version-comparison defaults to {last} (the comparator still runs),
          # while the value n/a means "don't do any comparison".
          sed -i -E 's/^(  version-comparison(-master)?:)/  # (disabled by ENABLE_VERSION_COMPARISON) \1/' sushi-config.yaml
          sed -i '/^parameters:/a\  version-comparison: n/a' sushi-config.yaml
          echo "::notice::version comparison disabled via ENABLE_VERSION_COMPARISON (set to the publisher-native n/a)."

      - name: Install Graphviz
        if: ${{ steps.tag.outputs.skip != 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Select terminology server (SU-TermServ if cert present, else HL7)
        id: tx
        if: ${{ steps.tag.outputs.skip != 'true' }}
        shell: bash
        env:
          SU_TERMSERV_CLIENT_CERT: ${{ secrets.SU_TERMSERV_CLIENT_CERT }}
          SU_TERMSERV_CLIENT_KEY: ${{ secrets.SU_TERMSERV_CLIENT_KEY }}
          SU_TERMSERV_CLIENT_PASSWORD: ${{ secrets.SU_TERMSERV_CLIENT_PASSWORD }}
        run: |
          set -euo pipefail
          # Prefer the MII terminology server (SU-TermServ) through a client-cert
          # nginx proxy; otherwise fall back to the public HL7 server. The build
          # must not hard-fail without the certificate.
          if [[ -n "${SU_TERMSERV_CLIENT_CERT}" ]] && [[ -n "${SU_TERMSERV_CLIENT_KEY}" ]] && [[ -n "${SU_TERMSERV_CLIENT_PASSWORD}" ]]; then
            nginx_dir="${RUNNER_TEMP}/nginx"
            mkdir -p "${nginx_dir}/certs"
            # nginx.conf pinned by commit SHA (same ref ig-publisher.yml uses).
            curl --fail --location --silent --show-error \
              "https://raw.githubusercontent.com/medizininformatik-initiative/kerndatensatz-meta/1db2e534704d92e5ee0cde663ce3e7ccd8825fa7/.github/workflows/nginx.conf" \
              --output "${nginx_dir}/nginx.conf"
            printf '%s' "${SU_TERMSERV_CLIENT_CERT}" | base64 --decode > "${nginx_dir}/certs/client-cert.pem"
            printf '%s' "${SU_TERMSERV_CLIENT_KEY}" | base64 --decode > "${nginx_dir}/certs/client-key-encrypted.key"
            openssl rsa \
              -in "${nginx_dir}/certs/client-key-encrypted.key" \
              -out "${nginx_dir}/certs/client-key.key" \
              -passin env:SU_TERMSERV_CLIENT_PASSWORD
            chmod 600 "${nginx_dir}/certs/"*
            docker run --detach --name release-demo-nginx \
              --volume "${nginx_dir}/nginx.conf:/etc/nginx/nginx.conf:ro" \
              --volume "${nginx_dir}/certs:/etc/nginx/certs:ro" \
              --publish 8090:80 \
              nginx:1.30.4-alpine@sha256:97d490c12ba55b4946b01546d1c3ed324e8d41ab1c9fcb2a616aa470620e5b46
            ready=false
            for _ in {1..15}; do
              if curl --head --silent --fail http://127.0.0.1:8090 >/dev/null; then ready=true; break; fi
              sleep 2
            done
            if [[ "${ready}" != "true" ]]; then docker logs release-demo-nginx; exit 1; fi
            echo "tx=http://127.0.0.1:8090/fhir" >> "${GITHUB_OUTPUT}"
            echo "mode=SU-TermServ via client-certificate proxy" >> "${GITHUB_OUTPUT}"
          else
            echo "tx=https://tx.fhir.org" >> "${GITHUB_OUTPUT}"
            echo "mode=public HL7 fallback (https://tx.fhir.org)" >> "${GITHUB_OUTPUT}"
            echo "::notice::No SU-TermServ client certificate configured — falling back to the public HL7 terminology server https://tx.fhir.org. Some MII-specific value sets may not fully expand (a QA note, not a failure)."
          fi

      - name: Build the released demo IG (SUSHI + the pinned IG Publisher)
        if: ${{ steps.tag.outputs.skip != 'true' }}
        shell: bash
        working-directory: release-src
        env:
          TX_URL: ${{ steps.tx.outputs.tx }}
          # Read-only, for seed-comparison-cache.sh's GitHub Release-asset lookup.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Seed the comparison cache exactly as the other build workflows do.
          # Run the TAG's copy (not the workspace root's): the script resolves
          # its repo root from its own location and must read the tree that is
          # being built. No-op unless sushi-config.yaml activates
          # `version-comparison`; warn-not-fail if a historical asset is gone.
          if [ -f scripts/seed-comparison-cache.sh ]; then
            bash scripts/seed-comparison-cache.sh
          fi
          npm install --global "fsh-sushi@${SUSHI_VERSION}"
          sushi .
          test -d fsh-generated/resources
          # IG Publisher pinned + checksum-verified (same jar as every other build).
          publisher_url="https://github.com/HL7/fhir-ig-publisher/releases/download/${PUBLISHER_VERSION}/publisher.jar"
          curl --fail --location --silent --show-error "${publisher_url}" --output "${RUNNER_TEMP}/publisher.jar"
          echo "${PUBLISHER_SHA256}  ${RUNNER_TEMP}/publisher.jar" | sha256sum --check
          # -fhir-settings allowlists the local SU-TermServ nginx proxy
          # (http://127.0.0.1:8090) for the publisher's terminology access:
          # publisher 2.3.1+ SSRF hardening can refuse plain-HTTP/private-
          # network -tx targets without it (basis idiom, kerndatensatz-basis
          # @190a3a18). Inert on the tx.fhir.org fallback path.
          java -Xmx6g -jar "${RUNNER_TEMP}/publisher.jar" -ig ig.ini -tx "${TX_URL}" \
            -fhir-settings "${GITHUB_WORKSPACE}/.github/fhir-settings.json"
          test -s output/index.html
          jq empty output/qa.json

      - name: Verify the render carries the tag's version
        if: ${{ steps.tag.outputs.skip != 'true' }}
        shell: bash
        working-directory: release-src
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          # The substitution script reports the value it wrote, so this check
          # asserts against the ONE source of truth instead of re-deriving the
          # formula here — a second copy of the formula could agree with itself
          # while both disagree with what was rendered.
          EXPECTED: ${{ steps.subst.outputs.demo_version }}
        run: |
          set -euo pipefail
          # The whole point of this workflow. Read the version back from the
          # GENERATED ImplementationGuide rather than from the rendered HTML, so
          # the check does not depend on how the IG template formats a title.
          expected="${EXPECTED:?the self-check substitution reported no demo_version}"
          ig_json="$(ls -1 fsh-generated/resources/ImplementationGuide-*.json | head -1)"
          test -s "${ig_json}"
          built="$(jq -r '.version' "${ig_json}")"
          if [ "${built}" != "${expected}" ]; then
            echo "::error::The built demo declares version '${built}', expected '${expected}' for tag ${TAG}. Refusing to publish a demo that misstates its release."
            exit 1
          fi
          echo "Rendered demo verified at version ${built} (tag ${TAG})."

      - name: Stop terminology proxy
        if: always()
        shell: bash
        run: docker rm --force release-demo-nginx >/dev/null 2>&1 || true

      - name: Upload build output (qa report + rendered index)
        if: ${{ always() && steps.tag.outputs.skip != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-demo-output-${{ steps.tag.outputs.tag }}
          path: |
            release-src/output/qa.json
            release-src/output/qa.html
            release-src/output/index.html
          if-no-files-found: warn

      - name: Publish to gh-pages/demo/<tag>/ and repoint the landing page
        id: publish
        if: ${{ steps.tag.outputs.skip != 'true' }}
        shell: bash
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
          UPDATE_PAGE: ${{ steps.tag.outputs.update_page }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_ACTIONS_ENABLED: ${{ vars.PAGES_ACTIONS_ENABLED }}
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
        run: |
          set -euo pipefail
          remote_url="https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git"
          rm -rf gh-pages
          if ! git ls-remote --heads "${remote_url}" gh-pages | grep -q "."; then
            echo "::error::No gh-pages branch yet. Let ig-publisher.yml create it (push any branch) before publishing a release demo."
            exit 1
          fi
          git clone --depth 1 --branch gh-pages "${remote_url}" gh-pages

          # ONLY demo/<tag>/ is written. The site ROOT's other content and every
          # version-like path stay reserved for the gated -go-publish output, and
          # branches/ stays the preview surface.
          demo_dir="gh-pages/demo/${TAG}"
          rm -rf "${demo_dir}"
          mkdir -p "${demo_dir}"
          cp -R "release-src/output/." "${demo_dir}/"
          # Deliberately NO .branch-name marker: that marker is what makes a
          # directory sweepable by cleanup-gh-pages.yml. A released demo is
          # permanent.
          if [ -e "${demo_dir}/.branch-name" ]; then
            echo "::error::The build output carries a .branch-name marker — a released demo must never be sweepable."
            exit 1
          fi
          # Serve the IG output verbatim — never let Pages re-run Jekyll on it.
          touch gh-pages/.nojekyll

          if [ "${UPDATE_PAGE}" = "true" ]; then
            if [ ! -f gh-pages/index.html ]; then
              echo "::error::gh-pages has no index.html to repoint. Restore the hand-authored landing page, or dispatch with update_landing_page=false to publish demo/${TAG}/ only."
              exit 1
            fi
            # Conservative, anchored rewrite of the HAND-AUTHORED landing page —
            # it is never regenerated. The script exits non-zero if a required
            # anchor is missing, so a page that silently keeps linking the
            # previous release fails the job instead of shipping.
            node scripts/update-demo-links.mjs \
              --file gh-pages/index.html \
              --version "${TAG}" \
              --repo-url "https://github.com/${REPO}" | tee "${RUNNER_TEMP}/landing-diff.txt"
          else
            echo "::notice::update_landing_page=false — demo/${TAG}/ published without repointing the landing page."
          fi

          cd gh-pages
          # Older demo/<tag>/ directories are KEPT (see the header). Report the
          # accumulated size so the 1 GB Pages limit stays visible.
          demo_bytes="$(du --bytes --summarize demo | cut -f1)"
          bytes="$(du --bytes --summarize --exclude=.git . | cut -f1)"
          echo "demo/ holds $(ls -1 demo | wc -l) released rendering(s), ${demo_bytes} bytes; whole site ${bytes} bytes."
          supported_max_bytes="1000000000"
          if (( bytes > supported_max_bytes )); then
            echo "::warning::The staged Pages site is ${bytes} bytes, above GitHub Pages' ${supported_max_bytes}-byte officially supported maximum. Publication will continue, but Pages does not guarantee deployments above 1 GB. Retiring the oldest demo/<tag>/ directories requires updating every link to them."
          fi

          git config user.name "${GIT_AUTHOR_NAME}"
          git config user.email "${GIT_AUTHOR_EMAIL}"
          git add --all
          if git diff --cached --quiet; then
            echo "No demo changes to publish for ${TAG}."
          else
            git commit -m "chore: publish rendered demo for ${TAG}"
            # gh-pages is written by several workflows in separate lanes now, so a
            # concurrent push is possible: retry with a rebase pull, bounded.
            for attempt in 1 2 3 4 5; do
              if git push origin gh-pages; then break; fi
              [ "$attempt" = "5" ] && { echo "::error::gh-pages push failed after 5 attempts"; exit 1; }
              git pull --rebase origin gh-pages
              sleep $(( attempt * 5 ))
            done
          fi

          url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO#*/}/demo/${TAG}/"
          echo "url=${url}" >> "${GITHUB_OUTPUT}"
          {
            echo "### Release demo — ${TAG}"
            echo ""
            echo "- [Rendered demo IG](${url})"
            echo "- Landing page: https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO#*/}/"
            echo "- Terminology: ${{ steps.tx.outputs.mode }}"
            echo ""
            if [ -s "${RUNNER_TEMP}/landing-diff.txt" ]; then
              echo "<details><summary>Landing-page changes</summary>"
              echo ""
              echo '```diff'
              cat "${RUNNER_TEMP}/landing-diff.txt"
              echo '```'
              echo ""
              echo "</details>"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      # ── PAGES_ACTIONS_ENABLED mode only: also publish via the Pages Actions
      # pipeline (Settings → Pages → GitHub Actions). Mirrors ig-publisher.yml's
      # tar + github-pages artifact + deploy-pages pairing (verified pins).
      - name: Package gh-pages tree as a Pages artifact
        if: ${{ steps.tag.outputs.skip != 'true' && vars.PAGES_ACTIONS_ENABLED == 'true' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: gh-pages

  deploy:
    name: Deploy GitHub Pages (Actions mode)
    if: ${{ needs.build.outputs.skip != 'true' && vars.PAGES_ACTIONS_ENABLED == 'true' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      id-token: write
      pages: write
    steps:
