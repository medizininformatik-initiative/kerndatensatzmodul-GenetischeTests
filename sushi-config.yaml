# The dependencies property corresponds to IG.dependsOn. The key is the
# package id and the value is the version (for advanced use cases the value
# can be an object with keys for id, uri, and version).
#
# Pinned to the exact versions the reference module kerndatensatz-basis pins on
# `main`. Fixed versions only — never `current`/`dev` (the go-publish workflow and the convention
# check reject floating versions; the dependency checker proposes bumps).
dependencies:
  # NO INLINE COMMENT AFTER A VERSION. SUSHI strips it correctly, but the IG
  # Publisher parses this file with its own reader and takes everything up to the
  # end of the line as the version -- "Unable to install de.basisprofil.r4#1.5.4
  # # Quelle: 1.5.x: Invalid criteria". It stays hidden for as long as SUSHI has
  # already put the package in ~/.fhir/packages, which is why three green builds
  # did not reveal it; the first dependency the cache does not hold breaks the run.
  # Keep every note ABOVE its line.

  # Source pin: 3.0.x
  hl7.fhir.uv.genomics-reporting: 3.0.0

  # Source pin: 2026.0.x, resolved to 2026.0.0 at migration time.
