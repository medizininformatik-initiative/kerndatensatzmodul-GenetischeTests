  de.basisprofil.r4: 1.6.0

  # Source pin: 2026.0.x, resolved to 2026.0.1 at migration time.
  # Bumped 2026-09-01 to the 2027 ballot release candidate, same measurement as meta.
  # Of the 16 resources whose content changed across both packages, 3 are referenced
  # by this module (Diagnose, Patient, PatientPseudonymisiert); every change is
  # additive (new 0..1 / 0..* extensions) and one binding on address.country was
  # REMOVED, i.e. loosened. Nothing was deleted or tightened.
  de.medizininformatikinitiative.kerndatensatz.base: 2027.0.0-ballot.rc1

  # Source pin: 2026.0.x
  de.medizininformatikinitiative.kerndatensatz.biobank: 2026.0.1

  # Source pin: 6.1.x. The module template pins 7.3.0; the source wins here, because
