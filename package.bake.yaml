to-json:
  - source: input
  - category: Resource
  - transform: json
  - target: staging

generate-snapshots:
  - source: staging
  - category: StructureDefinition
  - action: snapshot
  - target: staging

move-conformance-resources:
  - source: staging
  - category: Conformance
  - filter: status='active'
  - delete: /**/*implementationguide*.json
  - delete: /**/*implementationguide-1.x-en.json
  - delete: /**/*MII_IG_*.json
  - delete: /**/*mii-ig-*.json
  - delete: /**/*-ig-*.json
  - move: /package/
  - target: output

move-concept-maps:
  - source: staging
  - category: ConceptMap
  - filter: status='active'
  - move: /package/
  - target: output

move-examples:
  - source: staging
  - category: Instance
  - delete: /**/*ConceptMap*.json
  - delete: /**/*validation*.json
  - delete: /**/*qa*.json
  - delete: /**/*expansions*.json
  - delete: /**/*.terminologyCapabilities*.json
  - delete: /**/*onGenerate*.json
  - delete: /**/*onCheck*.json
  # Singular. The FHIR package convention and the IG Publisher both use
  # `package/example/`; this said `examples/`, so a locally baked package put its
  # instances where nothing looks for them. Caught by diffing a bake against the
  # IG Publisher output of the same commit.
  - move: /package/example
  - target: output

manifest:
  - files: package.json
  - move: /package

index-file:
  - source: output
  - files: /package/**/*.json
  - action: create-package-index
  - move: /package
